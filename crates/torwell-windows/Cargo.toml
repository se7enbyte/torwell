[package]
name = "torwell-windows"
version = "0.1.0"
edition = "2021"
description = "Windows backend for torwell: persistent WFP fail-closed policy, tun2proxy bridge supervision, Tor bootstrap, optional MAC"
publish = false

[dependencies]
torwell-core = { path = "../torwell-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_NetworkManagement_WindowsFilteringPlatform",
  "Win32_NetworkManagement_IpHelper",
  "Win32_Networking_WinSock",
  "Win32_System_Rpc",
  "Win32_System_Threading",
  "Win32_Security_Cryptography",
  "Win32_System_SystemInformation",
]

[workspace]
